<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM VENTAS</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>

<body>
    <div class="encabezado">
        <h1 class="titulo">
            Ingreso a la plataforma
        </h1>
    </div>
    <br>
    <div class="login">
        <b>
            <h1>4GSplay</h1>
            <br>
            Inicio de sesión
            <br>
            Introduce tu usuario y contraseña para continuar.
            <hr>
        </b>
    </div>
    <div class="panel-formulario">
        <div class="body-formulario">
            <form action="">
                <label for="usuario">Usuario: </label>
                <br>
                <br>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario"/>
                <br>
                <br>
                <label for="password">Contraseña: </label>
                <br>
                <br>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
                <br>
                <br>
                <input type="checkbox" name="condiciones" id="condiciones">Recordarme en este equipo
                <br>
                <br>
                <script data-cfasync="false" src="https://cdn.cloudflare.com/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js">
                </script>
                
                <button type="submit" style="background-color: #4CAF50; color: white; min-width: 250px; padding: 5px; border-radius: 5px; cursor: pointer; border: none;">
                    Ingresar
                </button> 
                <br>
            </form>
        </div>
        <div class="footer-panel">
            <a href="#">¿Olvidaste tu contraseña?</a> <a href="#">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>


   
       

    <footer>
        <div>
            <p>
                © 2026 4GSplay. All rights reserved.
            </p>
        </div>
</body>

</html>
